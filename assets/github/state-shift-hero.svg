<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="100%" height="100%">
  <style>
    .bg { fill: #07090e; }
    .grid-line { stroke: #151d2a; stroke-width: 1; }
    .title { font-family: 'JetBrains Mono', -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace; font-size: 38px; font-weight: 800; fill: #f1f5f9; letter-spacing: 0.12em; }
    .slash { fill: #38bdf8; font-weight: 300; }
    .author { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 600; fill: #94a3b8; letter-spacing: 0.2em; }
    .paradigm { font-family: 'Instrument Serif', Georgia, serif; font-size: 24px; font-style: italic; fill: #38bdf8; }
    .tag { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.15em; fill: #64748b; }
    .node-text { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; fill: #cbd5e1; }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }
    .pulse-node { transform-origin: center; animation: pulse 4s ease-in-out infinite; }
    .pulse-node-2 { transform-origin: center; animation: pulse 4s ease-in-out infinite 2s; }
    .edge-animated { stroke-dasharray: 6 4; animation: dash 2.5s linear infinite; }

    @media (prefers-color-scheme: light) {
      .bg { fill: #fafaf9; }
      .grid-line { stroke: #e2e8f0; }
      .title { fill: #09090b; }
      .slash { fill: #0284c7; }
      .author { fill: #475569; }
      .paradigm { fill: #0284c7; }
      .tag { fill: #64748b; }
      .node-text { fill: #334155; }
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1000" height="380" rx="16" class="bg" stroke="#1c2738" stroke-width="1.5" />

  <!-- Background Grid -->
  <line x1="40" y1="60" x2="960" y2="60" class="grid-line" />
  <line x1="40" y1="140" x2="960" y2="140" class="grid-line" />
  <line x1="40" y1="220" x2="960" y2="220" class="grid-line" />
  <line x1="40" y1="300" x2="960" y2="300" class="grid-line" />
  <line x1="200" y1="30" x2="200" y2="350" class="grid-line" />
  <line x1="500" y1="30" x2="500" y2="350" class="grid-line" />
  <line x1="800" y1="30" x2="800" y2="350" class="grid-line" />

  <!-- System Header Metadata -->
  <rect x="50" y="40" width="110" height="22" rx="4" fill="#0d1522" stroke="#1e293b" />
  <circle cx="62" cy="51" r="3.5" fill="#38bdf8" />
  <text x="74" y="55" class="tag" fill="#38bdf8">SYSTEM 00</text>
  <text x="175" y="55" class="tag">TOPOLOGICAL STATE INVARIANCE</text>

  <!-- Main Identity Typography -->
  <text x="50" y="110" class="title">STATE <tspan class="slash">/</tspan> SHIFT</text>
  <text x="52" y="142" class="author">SHAM SATISH THAKARE</text>
  <text x="52" y="180" class="paradigm">Reliable Adaptive Intelligent Systems</text>

  <!-- State Machine Badges -->
  <g transform="translate(50, 215)">
    <!-- REASON -->
    <rect x="0" y="0" width="90" height="28" rx="6" fill="#0e1726" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="14" cy="14" r="3" fill="#38bdf8" />
    <text x="25" y="18" font-family="JetBrains Mono" font-size="11" font-weight="700" fill="#38bdf8">REASON.</text>

    <!-- ADAPT -->
    <rect x="100" y="0" width="85" height="28" rx="6" fill="#140f26" stroke="#a855f7" stroke-width="1.2" />
    <circle cx="114" cy="14" r="3" fill="#a855f7" />
    <text x="125" y="18" font-family="JetBrains Mono" font-size="11" font-weight="700" fill="#a855f7">ADAPT.</text>

    <!-- VERIFY -->
    <rect x="195" y="0" width="90" height="28" rx="6" fill="#0c1f1a" stroke="#10b981" stroke-width="1.2" />
    <circle cx="209" cy="14" r="3" fill="#10b981" />
    <text x="220" y="18" font-family="JetBrains Mono" font-size="11" font-weight="700" fill="#10b981">VERIFY.</text>

    <!-- RECOVER -->
    <rect x="295" y="0" width="95" height="28" rx="6" fill="#241708" stroke="#f59e0b" stroke-width="1.2" />
    <circle cx="309" cy="14" r="3" fill="#f59e0b" />
    <text x="320" y="18" font-family="JetBrains Mono" font-size="11" font-weight="700" fill="#f59e0b">RECOVER.</text>
  </g>

  <!-- Bottom Telemetry Summary -->
  <text x="52" y="285" font-family="JetBrains Mono" font-size="11" fill="#64748b">
    RESEARCH × SYSTEMS × MACHINE INTELLIGENCE • PUNE, INDIA
  </text>
  <text x="52" y="308" font-family="JetBrains Mono" font-size="10" fill="#475569">
    EMPIRICAL INTEGRITY REGISTRY: r = 0.486 / r_partial = -0.092 • Γ_256 = +0.1176 • 18.7% FLOPs REDUCTION
  </text>

  <!-- Right Side Interactive Topology Graphic -->
  <g transform="translate(540, 20)">
    <!-- Connecting Edges -->
    <line x1="120" y1="80" x2="280" y2="70" stroke="#38bdf8" stroke-width="1.5" class="edge-animated" opacity="0.6" />
    <line x1="280" y1="70" x2="340" y2="190" stroke="#a855f7" stroke-width="1.5" opacity="0.4" />
    <line x1="340" y1="190" x2="240" y2="280" stroke="#10b981" stroke-width="1.5" class="edge-animated" opacity="0.6" />
    <line x1="240" y1="280" x2="80" y2="240" stroke="#f59e0b" stroke-width="1.5" opacity="0.4" />
    <line x1="80" y1="240" x2="120" y2="80" stroke="#f43f5e" stroke-width="1.5" class="edge-animated" opacity="0.6" />
    <line x1="120" y1="80" x2="240" y2="280" stroke="#3b82f6" stroke-width="1" opacity="0.25" stroke-dasharray="2 2" />

    <!-- Node 1: Reasoning -->
    <g class="pulse-node">
      <circle cx="120" cy="80" r="18" fill="#082f49" stroke="#38bdf8" stroke-width="2" />
      <circle cx="120" cy="80" r="6" fill="#38bdf8" />
    </g>
    <text x="120" y="114" text-anchor="middle" class="node-text">REASONING (RLVR)</text>

    <!-- Node 2: Plasticity -->
    <g class="pulse-node-2">
      <circle cx="280" cy="70" r="16" fill="#2e1065" stroke="#a855f7" stroke-width="2" />
      <circle cx="280" cy="70" r="5" fill="#a855f7" />
    </g>
    <text x="280" y="102" text-anchor="middle" class="node-text">PLASTICITY (CARLS)</text>

    <!-- Node 3: Agent Safety -->
    <g class="pulse-node">
      <circle cx="340" cy="190" r="17" fill="#064e3b" stroke="#10b981" stroke-width="2" />
      <circle cx="340" cy="190" r="6" fill="#10b981" />
    </g>
    <text x="340" y="222" text-anchor="middle" class="node-text">AGENT SAFETY</text>

    <!-- Node 4: Consensus -->
    <g class="pulse-node-2">
      <circle cx="240" cy="280" r="16" fill="#451a03" stroke="#f59e0b" stroke-width="2" />
      <circle cx="240" cy="280" r="5" fill="#f59e0b" />
    </g>
    <text x="240" y="312" text-anchor="middle" class="node-text">QUORUM (C++20)</text>

    <!-- Node 5: Recovery -->
    <g class="pulse-node">
      <circle cx="80" cy="240" r="15" fill="#4c0519" stroke="#f43f5e" stroke-width="2" />
      <circle cx="80" cy="240" r="5" fill="#f43f5e" />
    </g>
    <text x="80" y="272" text-anchor="middle" class="node-text">RECOVERY_EVAL</text>
  </g>
</svg>
